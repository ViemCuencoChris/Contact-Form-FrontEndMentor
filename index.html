<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Contact form</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="flex justify-center items-center min-h-screen bg-green-200 font-karla p-6">
  <div class="flex flex-col gap-4 bg-white rounded-2xl p-6">
    <h1 class="text-3xl font-bold mb-2">Contact Us</h1>

    <div class="flex flex-col gap-1">
      <label class="text-gray-900" for="firstName">First Name</label>
      <input class="outline-none border border-solid border-gray-500 rounded-lg h-10 p-2" id="firstName" type="text">
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-gray-900" for="lastName">Last Name</label>
      <input class="outline-none border border-solid border-gray-500 rounded-lg h-10 p-2" id="lastName" type="text">
    </div>
    
    <div class="flex flex-col gap-1">
      <label class="text-gray-900" for="email">Email Address</label>
      <input class="outline-none border border-solid border-gray-500 rounded-lg h-10 p-2" id="email" type="text">
    </div>
    
    <div class="flex flex-col gap-2">
      <h2 class="text-gray-900 mb-1">Query Type</h2>
      <label class="flex justify-start items-center gap-2 px-4 mb-2 border border-solid border-gray-500 rounded-lg h-10 text-gray-900" for="generalEnquiry">
        <input id="generalEnquiry" type="radio" name="query">
        General Enquiry
      </label>
      <label class="flex justify-start items-center gap-2 px-4 mb-2 border border-solid border-gray-500 rounded-lg h-10 text-gray-900" for="supportRequest">
        <input id="supportRequest" type="radio" name="query">
        Support Request
      </label>
    </div>
    
    <div class="flex flex-col gap-1">
      <label class="text-gray-900" for="message">Message</label>
      <textarea class="outline-none border border-solid border-gray-500 rounded-lg h-52 p-2" id="message" type="text"></textarea>
    </div>

    <label class="flex gap-4 justify-start items-center my-4 px-2 text-gray-900" id="consent" for="consent">
      <input class="appearance-none w-5 h-4 border border-solid border-gray-500 checked:bg-[url('assets/images/icon-checkbox-check.svg')] checked:bg-center checked:bg-no-repeat checked:bg-cover checked:border-transparent" id="consent" type="checkbox">
      I consent to being contacted by the team
    </label>

    <button class="bg-green-600 text-lg text-white font-bold p-4 rounded-xl" id="submit">Submit</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
