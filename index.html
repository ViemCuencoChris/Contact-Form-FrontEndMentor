<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Contact form</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="flex justify-center items-center min-h-screen">
  <div class="flex flex-col">
    <h1 class="">Contact Us</h1>

    <div class="flex flex-col">
      <div>
        <label class="" for="firstName">First Name</label>
        <input id="firstName" type="text">
      </div>
      <div>
        <label class="" for="lastName">Last Name</label>
        <input id="lastName" type="text">
      </div>
    </div>
    
    <label class="" for="email">Email Address</label>
    <input id="email" type="text">
    
    <h2 class="">Query Type</h2>
    <div class="flex flex-col">
      <div>
        <label class="" for="generalEnquiry">General Enquiry</label>
        <input id="generalEnquiry" type="text">
      </div>
      <div>
        <label class="" for="supportRequest">Support Request</label>
        <input id="supportRequest" type="text">
      </div>
    </div>
    
    <div>
      <label class="" for="message">Message</label>
      <input id="message" type="text">
    </div>

    <div>
      <input class="" id="consent" type="radio">
      <label id="consent" for="">I consent to being contacted by the team</label>
    </div>

    <button>Submit</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
